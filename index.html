<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Didattico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS BASE --- */
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); min-height: 85vh; position: relative; }
        
        /* Header */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #e5e7eb; padding-bottom: 15px; }
        h2 { margin: 0; color: #4f46e5; font-weight: 800; font-size: 1.5rem; }
        .user-info { font-size: 0.9rem; color: #6b7280; font-weight: 500; }
        
        button.logout-btn { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        
        /* Form & Inputs */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; color: #374151; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: #fff; }
        input:focus, select:focus, textarea:focus { border-color: #4f46e5; outline: 3px solid #e0e7ff; }
        textarea { height: 80px; resize: vertical; }
        
        button.primary-btn { width: 100%; padding: 12px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button.primary-btn:hover { background-color: #4338ca; }

        /* --- CARTE CORSI --- */
        .grid-courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        
        .course-folder { 
            background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; 
            cursor: pointer; transition: all 0.2s; position: relative; border-bottom: 4px solid #4f46e5;
        }
        .course-folder:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(0,0,0,0.08); }
        .cf-title { font-weight: 700; font-size: 1rem; color: #111; margin-bottom: 5px; }
        .cf-count { font-size: 0.8rem; color: #6b7280; background: #f3f4f6; padding: 2px 8px; border-radius: 10px; display: inline-block; }

        /* --- LISTA STORICO & TOOLBAR --- */
        .history-container { display: none; animation: fadeIn 0.3s ease; }
        .history-container.active { display: block; }

        .history-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f9fafb; padding: 10px; border-radius: 8px; }
        .sort-select { padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 0.9rem; }
        
        .lezione-card { background: #fff; border: 1px solid #e5e7eb; border-left: 5px solid #10b981; padding: 15px; margin-top: 15px; border-radius: 8px; position: relative; }
        .card-top { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .date-badge { background: #f3f4f6; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; color: #6b7280; }
        
        .actions-div { display: flex; gap: 8px; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px; transition: transform 0.2s; }
        .icon-btn:hover { transform: scale(1.2); }

        .back-btn { background: none; border: none; color: #666; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; margin-bottom: 10px; font-size: 0.9rem; }
        .back-btn:hover { color: #111; }

        /* MODAL MODIFICA */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }

        /* Admin Styles */
        .admin-tools { background: #fffbeb; border: 1px solid #fcd34d; padding: 15px; border-radius: 12px; margin-bottom: 30px; }
        .user-card { background: white; border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
        
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    
    <div class="app-header">
        <div>
            <h2>Registro Didattico</h2>
            <div id="user-display" class="user-info">Caricamento...</div>
        </div>
        <button id="logout-btn" class="logout-btn hidden" onclick="logout()">Esci</button>
    </div>

    <div id="login-section">
        <div style="max-width:350px; margin:50px auto; text-align:center;">
            <h3 style="margin-bottom:20px; color:#333">Accesso Area Riservata</h3>
            <input type="email" id="email" placeholder="Email" style="margin-bottom:10px">
            <input type="password" id="password" placeholder="Password" style="margin-bottom:20px">
            <button id="btn-login" class="primary-btn">Accedi</button>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        
        <div id="admin-view" class="hidden">
            <div class="admin-tools">
                <h3 style="margin-top:0; color:#b45309">🛠 Crea Corso & Assegna</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr auto; gap:10px; align-items:end;">
                    <input type="text" id="new-course-name" placeholder="Es. Lunedì 18:00">
                    <input type="email" id="new-course-email" placeholder="istruttore@email.com">
                    <button onclick="addCourse()" class="primary-btn" style="background:#d97706; padding:10px">Crea</button>
                </div>
            </div>
            
            <h3 style="margin-bottom:10px">👥 Team & Assegnazioni</h3>
            <div id="instructors-grid" class="grid-courses"></div>
            
            <div id="admin-detail-area" class="hidden" style="margin-top:30px; border-top:1px solid #eee; padding-top:20px">
                <h4 style="margin:0 0 15px 0">Attività di <span id="adm-sel-user" style="color:#4f46e5">...</span></h4>
                <div id="admin-lessons-list"></div>
            </div>
        </div>

        <div id="instructor-view" class="hidden">
            
            <h3 style="margin-bottom:15px">Nuova Lezione</h3>
            <div style="background:#f9fafb; padding:20px; border-radius:12px; border:1px solid #e5e7eb;">
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="data">
                </div>
                <div class="form-group">
                    <label>Seleziona Corso</label>
                    <select id="corso"><option>Caricamento...</option></select>
                </div>
                
                <div class="form-group">
                    <label>Obiettivo della lezione</label>
                    <input type="text" id="obiettivo" placeholder="Es. Miglioramento virata dorso">
                </div>

                <div class="form-group">
                    <label>Attività Svolta</label>
                    <textarea id="attivita" placeholder="Descrizione esercizi..."></textarea>
                </div>
                <button onclick="salvaLezione()" class="primary-btn">Salva Lezione</button>
            </div>

            <div id="courses-overview">
                <h3 style="margin-top:40px; border-bottom:1px solid #ddd; padding-bottom:10px">I Tuoi Corsi</h3>
                <div id="my-courses-grid" class="grid-courses">
                    <p style="color:#666">Caricamento corsi...</p>
                </div>
            </div>

            <div id="course-history" class="history-container">
                <div style="margin-top:30px; border-top:1px solid #ddd; padding-top:15px">
                    <button class="back-btn" onclick="closeHistory()">⬅ Torna ai Corsi</button>
                    
                    <div class="history-toolbar">
                        <h3 style="margin:0; color:#4f46e5; font-size:1.1rem"><span id="hist-title">...</span></h3>
                        <select id="sort-order" class="sort-select" onchange="renderHistoryList()">
                            <option value="desc">Più Recenti</option>
                            <option value="asc">Più Vecchi</option>
                        </select>
                    </div>

                    <div id="history-list"></div>
                </div>
            </div>

        </div>

    </div>
</div>

<div id="edit-modal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="margin-top:0">✏️ Modifica Lezione</h3>
        <input type="hidden" id="edit-id">
        
        <div class="form-group">
            <label>Data</label>
            <input type="date" id="edit-data">
        </div>
        <div class="form-group">
            <label>Obiettivo</label>
            <input type="text" id="edit-obiettivo">
        </div>
        <div class="form-group">
            <label>Attività</label>
            <textarea id="edit-attivita" style="height:100px"></textarea>
        </div>
        
        <div style="display:flex; gap:10px; margin-top:20px">
            <button onclick="closeEditModal()" style="flex:1; padding:10px; border:none; background:#e5e7eb; border-radius:8px; cursor:pointer">Annulla</button>
            <button onclick="saveEdit()" style="flex:1; padding:10px; border:none; background:#4f46e5; color:white; border-radius:8px; font-weight:bold; cursor:pointer">Salva Modifiche</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- CONFIGURAZIONE ---
    const firebaseConfig = {
      apiKey: "AIzaSyAi5AwcIcjgLGyI7E8x4ndcYCI9DUIybeA",
      authDomain: "gestioneore-3bf5f.firebaseapp.com",
      projectId: "gestioneore-3bf5f",
      storageBucket: "gestioneore-3bf5f.firebasestorage.app",
      messagingSenderId: "99818377406",
      appId: "1:99818377406:web:a62ee0e6f323b8b4178eef"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentUser = null;
    let myLessonsCache = []; 
    let currentOpenCourse = null; // Per sapere quale corso stiamo guardando

    const ADMIN_EMAIL = "a.chiodini01@gmail.com"; 

    // AUTH
    document.getElementById('btn-login').addEventListener('click', async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
        catch (e) { alert(e.message); }
    });
    window.logout = async () => { await signOut(auth); window.location.reload(); };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-display').innerText = user.email;
            document.getElementById('data').valueAsDate = new Date();

            if(isAdmin) {
                document.getElementById('admin-view').classList.remove('hidden');
                initAdmin();
            } else {
                document.getElementById('instructor-view').classList.remove('hidden');
                initInstructor();
            }
        } else {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
        }
    });

    // --- ISTRUTTORE ---

    function initInstructor() {
        // 1. CARICA IL MENU A TENDINA
        onSnapshot(query(collection(db, "corsi_assegnati"), where("istruttore", "==", currentUser.email.toLowerCase())), (snap) => {
            const sel = document.getElementById('corso');
            sel.innerHTML = "";
            let coursesFound = false;
            snap.forEach(d => {
                sel.innerHTML += `<option>${d.data().nome}</option>`;
                coursesFound = true;
            });
            if(!coursesFound) sel.innerHTML = "<option>Nessun corso assegnato</option>";
        });

        // 2. CARICA LE LEZIONI
        const qLez = query(collection(db, "registro_didattico"), where("uid", "==", currentUser.uid));
        
        onSnapshot(qLez, (snap) => {
            myLessonsCache = [];
            snap.forEach(d => myLessonsCache.push({id:d.id, ...d.data()}));
            
            // Aggiorna la vista corsi
            renderCourseFolders();
            
            // Se ho lo storico aperto, aggiorno anche quello in tempo reale
            if(currentOpenCourse) {
                renderHistoryList();
            }
        });
    }

    // Genera le "Cartelle" dei corsi
    function renderCourseFolders() {
        const groups = {};
        myLessonsCache.forEach(l => {
            if(!groups[l.corso]) groups[l.corso] = [];
            groups[l.corso].push(l);
        });

        const grid = document.getElementById('my-courses-grid');
        grid.innerHTML = "";

        const courseNames = Object.keys(groups).sort();
        
        if(courseNames.length === 0) {
            grid.innerHTML = "<p>Nessuna lezione salvata ancora.</p>";
            return;
        }

        courseNames.forEach(cName => {
            const count = groups[cName].length;
            const div = document.createElement('div');
            div.className = 'course-folder';
            div.innerHTML = `
                <div class="cf-title">${cName}</div>
                <div class="cf-count">${count} Schede</div>
            `;
            div.onclick = () => openHistory(cName);
            grid.appendChild(div);
        });
    }

    // Apre lo storico
    window.openHistory = (courseName) => {
        currentOpenCourse = courseName;
        document.getElementById('courses-overview').classList.add('hidden');
        document.getElementById('course-history').classList.add('active');
        document.getElementById('hist-title').innerText = courseName;
        renderHistoryList();
    };

    // Renderizza la lista con filtri e bottoni
    window.renderHistoryList = () => {
        if(!currentOpenCourse) return;
        
        const sortOrder = document.getElementById('sort-order').value;
        const list = document.getElementById('history-list');
        list.innerHTML = "";

        // Filtra solo il corso corrente
        let filtered = myLessonsCache.filter(l => l.corso === currentOpenCourse);

        // Ordina
        filtered.sort((a,b) => {
            return sortOrder === 'desc' 
                ? new Date(b.data) - new Date(a.data) 
                : new Date(a.data) - new Date(b.data);
        });

        if(filtered.length === 0) {
            list.innerHTML = "<p>Nessuna lezione trovata.</p>";
            return;
        }

        filtered.forEach(l => {
            list.innerHTML += `
                <div class="lezione-card">
                    <div class="card-top">
                        <span class="date-badge">📅 ${new Date(l.data).toLocaleDateString('it-IT')}</span>
                        <div class="actions-div">
                            <button class="icon-btn" onclick="openEditModal('${l.id}')" title="Modifica">✏️</button>
                            <button class="icon-btn" onclick="deleteLesson('${l.id}')" title="Elimina" style="color:#ef4444">🗑️</button>
                        </div>
                    </div>
                    <div style="font-weight:600; margin-bottom:5px; color:#333">🎯 ${l.obiettivo || '-'}</div>
                    <div style="color:#555; font-size:0.95rem; line-height:1.4">${l.attivita}</div>
                </div>
            `;
        });
    };

    window.closeHistory = () => {
        currentOpenCourse = null;
        document.getElementById('course-history').classList.remove('active');
        document.getElementById('courses-overview').classList.remove('hidden');
    };

    // --- FUNZIONI MODIFICA & ELIMINA ---

    window.deleteLesson = async (id) => {
        if(confirm("Sei sicuro di voler eliminare questa lezione?")) {
            await deleteDoc(doc(db, "registro_didattico", id));
        }
    };

    window.openEditModal = (id) => {
        const lesson = myLessonsCache.find(l => l.id === id);
        if(!lesson) return;

        document.getElementById('edit-id').value = id;
        document.getElementById('edit-data').value = lesson.data;
        document.getElementById('edit-obiettivo').value = lesson.obiettivo;
        document.getElementById('edit-attivita').value = lesson.attivita;

        document.getElementById('edit-modal').style.display = 'flex';
    };

    window.closeEditModal = () => {
        document.getElementById('edit-modal').style.display = 'none';
    };

    window.saveEdit = async () => {
        const id = document.getElementById('edit-id').value;
        const newData = {
            data: document.getElementById('edit-data').value,
            obiettivo: document.getElementById('edit-obiettivo').value,
            attivita: document.getElementById('edit-attivita').value
        };

        if(!newData.data || !newData.attivita) return alert("Compila i campi");

        try {
            await updateDoc(doc(db, "registro_didattico", id), newData);
            closeEditModal();
        } catch(e) { alert("Errore modifica: " + e.message); }
    };

    window.salvaLezione = async () => {
        try {
            await addDoc(collection(db, "registro_didattico"), {
                uid: currentUser.uid,
                email: currentUser.email,
                data: document.getElementById('data').value,
                corso: document.getElementById('corso').value,
                obiettivo: document.getElementById('obiettivo').value,
                attivita: document.getElementById('attivita').value,
                timestamp: new Date()
            });
            alert("Salvato! ✅");
            document.getElementById('attivita').value = "";
            document.getElementById('obiettivo').value = "";
        } catch(e){ alert(e.message); }
    };

    // --- ADMIN (Semplificato) ---
    function initAdmin() {
        onSnapshot(collection(db, "registro_didattico"), (snap) => {});
    }
    window.addCourse = async () => {
        try {
            await addDoc(collection(db, "corsi_assegnati"), { 
                nome: document.getElementById('new-course-name').value, 
                istruttore: document.getElementById('new-course-email').value.trim().toLowerCase(), 
                created: new Date() 
            });
            alert("Corso Creato!");
            document.getElementById('new-course-name').value = "";
            document.getElementById('new-course-email').value = "";
        } catch(e){ alert(e.message); }
    };

</script>
</body>
</html>
