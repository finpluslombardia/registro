<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Didattico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS BASE --- */
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; padding: 20px; margin: 0; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); min-height: 85vh; position: relative; }
        
        /* Header */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #e5e7eb; padding-bottom: 15px; }
        h2 { margin: 0; color: #4f46e5; font-weight: 800; font-size: 1.5rem; }
        .user-info { font-size: 0.9rem; color: #6b7280; font-weight: 500; }
        button.logout-btn { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        
        /* Form & Inputs */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; color: #374151; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: #fff; }
        input:focus, select:focus, textarea:focus { border-color: #4f46e5; outline: 3px solid #e0e7ff; }
        textarea { height: 80px; resize: vertical; }
        button.primary-btn { width: 100%; padding: 12px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button.primary-btn:hover { background-color: #4338ca; }

        /* --- ADMIN TOOLS --- */
        .admin-tools { background: #fffbeb; border: 1px solid #fcd34d; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .create-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1.5fr auto; gap: 10px; align-items: end; }
        @media (max-width: 700px) { .create-grid { grid-template-columns: 1fr 1fr; } .create-grid button { grid-column: span 2; } }

        /* Gestione Livelli */
        .levels-manager { margin-bottom: 25px; border-bottom: 1px solid #fcd34d; padding-bottom: 20px; }
        .levels-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .level-tag { background: white; border: 1px solid #d97706; color: #b45309; padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .btn-del-level { background: #fee2e2; color: #ef4444; border: none; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; }
        .add-level-box { display: flex; gap: 10px; margin-top: 10px; max-width: 400px; }

        /* Card Istruttori */
        .grid-courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; margin-top: 20px; }
        .user-card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.03); position: relative; overflow: hidden; }
        .user-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(0,0,0,0.08); border-color: #4f46e5; }
        .user-card.active { border: 2px solid #4f46e5; background: #e0e7ff; }
        .uc-name { font-weight: 700; font-size: 1.1rem; color: #111; margin-bottom: 2px; }
        .uc-email { font-size: 0.75rem; color: #6b7280; margin-bottom: 15px; display: block; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .uc-stats { display: flex; justify-content: space-between; border-top: 1px solid #f3f4f6; padding-top: 10px; }
        .uc-val { display: block; font-weight: 800; font-size: 1.2rem; color: #4f46e5; }

        /* ADMIN: Corsi Assegnati Box */
        .assigned-courses-box { background: #eef2ff; border: 1px solid #c7d2fe; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .ac-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 8px 12px; border-radius: 6px; margin-bottom: 5px; border: 1px solid #e0e7ff; }
        .ac-title { font-weight: 600; color: #3730a3; font-size: 0.9rem; }
        .btn-del-assign { background: #fee2e2; color: #ef4444; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }

        /* Istruttore: Course Folders */
        .course-folder { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.2s; position: relative; border-bottom: 4px solid #4f46e5; }
        .course-folder:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(0,0,0,0.08); }
        .cf-title { font-weight: 700; font-size: 1rem; color: #111; margin-bottom: 5px; }
        .cf-count { font-size: 0.8rem; color: #6b7280; background: #f3f4f6; padding: 2px 8px; border-radius: 10px; display: inline-block; }

        /* Storico & Cards */
        .history-container { display: none; animation: fadeIn 0.3s ease; }
        .history-container.active { display: block; }
        .history-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f9fafb; padding: 10px; border-radius: 8px; }
        .lezione-card { background: #fff; border: 1px solid #e5e7eb; border-left: 5px solid #10b981; padding: 15px; margin-top: 15px; border-radius: 8px; position: relative; }
        .card-top { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .date-badge { background: #f3f4f6; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; color: #6b7280; }
        .actions-div { display: flex; gap: 8px; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px; transition: transform 0.2s; }
        .icon-btn:hover { transform: scale(1.2); }
        .back-btn { background: none; border: none; color: #666; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; margin-bottom: 10px; font-size: 0.9rem; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }

        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    
    <div class="app-header">
        <div>
            <h2>Registro Didattico</h2>
            <div id="user-display" class="user-info">Caricamento...</div>
        </div>
        <button id="logout-btn" class="logout-btn hidden" onclick="logout()">Esci</button>
    </div>

    <div id="login-section">
        <div style="max-width:350px; margin:50px auto; text-align:center;">
            <h3 style="margin-bottom:20px; color:#333">Accesso Area Riservata</h3>
            <input type="email" id="email" placeholder="Email" style="margin-bottom:10px">
            <input type="password" id="password" placeholder="Password" style="margin-bottom:20px">
            <button id="btn-login" class="primary-btn">Accedi</button>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        
        <div id="admin-view" class="hidden">
            
            <div class="admin-tools">
                <div class="levels-manager">
                    <h3 style="margin-top:0; color:#b45309">🎚 Gestione Livelli</h3>
                    <div id="levels-container" class="levels-container">
                        <span style="font-size:0.8rem; color:#b45309; opacity:0.7">Caricamento livelli...</span>
                    </div>
                    <div class="add-level-box">
                        <input type="text" id="new-level-input" placeholder="Nuovo livello (es. Master)" style="padding:8px; font-size:0.9rem">
                        <button onclick="saveNewLevel()" style="background:#b45309; color:white; border:none; padding:0 15px; border-radius:8px; cursor:pointer; font-weight:bold">+</button>
                    </div>
                </div>

                <h3 style="margin-top:20px; color:#b45309">🛠 Nuova Assegnazione Corso</h3>
                <div class="create-grid">
                    <div><label style="color:#b45309">Livello</label><select id="new-level-select"><option value="">-- Caricamento --</option></select></div>
                    <div><label style="color:#b45309">Giorno</label><select id="new-day"><option value="">Scegli...</option><option>Lunedì</option><option>Martedì</option><option>Mercoledì</option><option>Giovedì</option><option>Venerdì</option><option>Sabato</option><option>Domenica</option></select></div>
                    <div><label style="color:#b45309">Ora</label><input type="time" id="new-time"></div>
                    <div><label style="color:#b45309">Istruttore (Email)</label><input type="email" id="new-email" placeholder="email@istr.it"></div>
                    <button onclick="addCourseStructured()" class="primary-btn" style="background:#d97706; padding:10px">Crea</button>
                </div>
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:end; margin-bottom:15px">
                <h3 style="margin:0">👥 Team Istruttori</h3>
                <button onclick="renderAdminDashboard(null)" style="background:none; border:none; color:#4f46e5; cursor:pointer; font-weight:600; font-size:0.9rem">Mostra Tutti</button>
            </div>
            
            <div id="instructors-grid" class="grid-courses"></div>
            
            <div id="admin-detail-area" class="hidden" style="margin-top:30px; border-top:1px solid #eee; padding-top:20px">
                <h4 style="margin:0 0 10px 0">Dettagli di <span id="adm-sel-user" style="color:#4f46e5">...</span></h4>
                
                <div class="assigned-courses-box">
                    <h5 style="margin:0 0 10px 0; color:#3730a3">📋 Corsi Assegnati</h5>
                    <div id="admin-assigned-list"></div>
                </div>

                <h5 style="margin:20px 0 10px 0">📝 Storico Lezioni</h5>
                <div id="admin-lessons-list"></div>
            </div>
        </div>

        <div id="instructor-view" class="hidden">
            <h3 style="margin-bottom:15px">Nuova Lezione</h3>
            <div style="background:#f9fafb; padding:20px; border-radius:12px; border:1px solid #e5e7eb;">
                <div class="form-group"><label>Data</label><input type="date" id="data"></div>
                <div class="form-group"><label>Seleziona Corso</label><select id="corso"><option>Caricamento...</option></select></div>
                <div class="form-group"><label>Obiettivo</label><input type="text" id="obiettivo" placeholder="Es. Dorso"></div>
                <div class="form-group"><label>Attività Svolta</label><textarea id="attivita" placeholder="Descrizione..."></textarea></div>
                <button onclick="salvaLezione()" class="primary-btn">Salva Lezione</button>
            </div>

            <div id="courses-overview">
                <h3 style="margin-top:40px; border-bottom:1px solid #ddd; padding-bottom:10px">I Tuoi Corsi</h3>
                <div id="my-courses-grid" class="grid-courses"><p style="color:#666">Caricamento corsi...</p></div>
            </div>

            <div id="course-history" class="history-container">
                <div style="margin-top:30px; border-top:1px solid #ddd; padding-top:15px">
                    <button class="back-btn" onclick="closeHistory()">⬅ Torna ai Corsi</button>
                    <div class="history-toolbar">
                        <h3 style="margin:0; color:#4f46e5; font-size:1.1rem"><span id="hist-title">...</span></h3>
                        <select id="sort-order" class="sort-select" onchange="renderHistoryList()"><option value="desc">Più Recenti</option><option value="asc">Più Vecchi</option></select>
                    </div>
                    <div id="history-list"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<div id="edit-modal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="margin-top:0">✏️ Modifica Lezione</h3>
        <input type="hidden" id="edit-id">
        <div class="form-group"><label>Data</label><input type="date" id="edit-data"></div>
        <div class="form-group"><label>Obiettivo</label><input type="text" id="edit-obiettivo"></div>
        <div class="form-group"><label>Attività</label><textarea id="edit-attivita" style="height:100px"></textarea></div>
        <div style="display:flex; gap:10px; margin-top:20px">
            <button onclick="closeEditModal()" style="flex:1; padding:10px; border:none; background:#e5e7eb; border-radius:8px; cursor:pointer">Annulla</button>
            <button onclick="saveEdit()" style="flex:1; padding:10px; border:none; background:#4f46e5; color:white; border-radius:8px; font-weight:bold; cursor:pointer">Salva</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // CONFIGURAZIONE
    const firebaseConfig = {
      apiKey: "AIzaSyAi5AwcIcjgLGyI7E8x4ndcYCI9DUIybeA",
      authDomain: "gestioneore-3bf5f.firebaseapp.com",
      projectId: "gestioneore-3bf5f",
      storageBucket: "gestioneore-3bf5f.firebasestorage.app",
      messagingSenderId: "99818377406",
      appId: "1:99818377406:web:a62ee0e6f323b8b4178eef"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentUser = null;
    let myLessonsCache = []; 
    let myAssignmentsCache = []; // Per l'istruttore
    let allLessonsCache = []; 
    let allAssignmentsCache = []; 
    let currentOpenCourse = null; 

    // IMPORTANTE: TUA EMAIL ADMIN
    const ADMIN_EMAIL = "a.chiodini01@gmail.com"; 

    // AUTH
    document.getElementById('btn-login').addEventListener('click', async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
        catch (e) { alert(e.message); }
    });
    window.logout = async () => { await signOut(auth); window.location.reload(); };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-display').innerText = user.email;
            document.getElementById('data').valueAsDate = new Date();

            if(isAdmin) {
                document.getElementById('admin-view').classList.remove('hidden');
                initAdmin();
            } else {
                document.getElementById('instructor-view').classList.remove('hidden');
                initInstructor();
            }
        } else {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
        }
    });

    // --- ISTRUTTORE ---
    function initInstructor() {
        // 1. Carica Corsi Assegnati (per menu e griglia)
        onSnapshot(query(collection(db, "corsi_assegnati"), where("istruttore", "==", currentUser.email.toLowerCase())), (snap) => {
            const sel = document.getElementById('corso');
            sel.innerHTML = "";
            myAssignmentsCache = []; // Reset cache
            
            snap.forEach(d => {
                const corsoData = d.data();
                myAssignmentsCache.push(corsoData.nome); // Salvo solo il nome
                sel.innerHTML += `<option>${corsoData.nome}</option>`;
            });

            if(myAssignmentsCache.length === 0) sel.innerHTML = "<option>Nessun corso assegnato</option>";
            
            // Aggiorno la griglia corsi (chiamo la funzione qui perché dipende dagli assegnamenti)
            renderCourseFolders();
        });

        // 2. Carica Lezioni (per conteggi e storico)
        onSnapshot(query(collection(db, "registro_didattico"), where("uid", "==", currentUser.uid)), (snap) => {
            myLessonsCache = [];
            snap.forEach(d => myLessonsCache.push({id:d.id, ...d.data()}));
            
            // Ridisegna la griglia per aggiornare i conteggi
            renderCourseFolders();
            
            if(currentOpenCourse) renderHistoryList();
        });
    }

    function renderCourseFolders() {
        const grid = document.getElementById('my-courses-grid');
        grid.innerHTML = "";
        
        // Unisco corsi assegnati e corsi che hanno lezioni (caso mai ne avesse uno vecchio non più assegnato)
        const allCourseNames = new Set(myAssignmentsCache);
        myLessonsCache.forEach(l => allCourseNames.add(l.corso));

        const sortedCourses = Array.from(allCourseNames).sort();

        if(sortedCourses.length === 0) {
            grid.innerHTML = "<p>Nessun corso assegnato e nessuna lezione.</p>";
            return;
        }

        sortedCourses.forEach(cName => {
            // Conto quante lezioni ci sono per questo corso
            const count = myLessonsCache.filter(l => l.corso === cName).length;
            
            const div = document.createElement('div');
            div.className = 'course-folder';
            div.innerHTML = `<div class="cf-title">${cName}</div><div class="cf-count">${count} Schede</div>`;
            div.onclick = () => openHistory(cName);
            grid.appendChild(div);
        });
    }

    window.openHistory = (courseName) => {
        currentOpenCourse = courseName;
        document.getElementById('courses-overview').classList.add('hidden');
        document.getElementById('course-history').classList.add('active');
        document.getElementById('hist-title').innerText = courseName;
        renderHistoryList();
    };

    window.renderHistoryList = () => {
        if(!currentOpenCourse) return;
        const sortOrder = document.getElementById('sort-order').value;
        const list = document.getElementById('history-list');
        list.innerHTML = "";
        let filtered = myLessonsCache.filter(l => l.corso === currentOpenCourse);
        filtered.sort((a,b) => sortOrder === 'desc' ? new Date(b.data) - new Date(a.data) : new Date(a.data) - new Date(b.data));

        if(filtered.length === 0) { list.innerHTML = "<p>Nessuna lezione trovata.</p>"; return; }

        filtered.forEach(l => {
            list.innerHTML += `
                <div class="lezione-card">
                    <div class="card-top">
                        <span class="date-badge">📅 ${new Date(l.data).toLocaleDateString('it-IT')}</span>
                        <div class="actions-div">
                            <button class="icon-btn" onclick="openEditModal('${l.id}')">✏️</button>
                            <button class="icon-btn" onclick="deleteLesson('${l.id}')" style="color:#ef4444">🗑️</button>
                        </div>
                    </div>
                    <div style="font-weight:600; margin-bottom:5px; color:#333">🎯 ${l.obiettivo || '-'}</div>
                    <div style="color:#555; font-size:0.9rem; line-height:1.4">${l.attivita}</div>
                </div>
            `;
        });
    };
    window.closeHistory = () => {
        currentOpenCourse = null;
        document.getElementById('course-history').classList.remove('active');
        document.getElementById('courses-overview').classList.remove('hidden');
    };

    // --- FUNZIONI COMUNI ---
    window.deleteLesson = async (id) => { if(confirm("Eliminare questa lezione?")) await deleteDoc(doc(db, "registro_didattico", id)); };
    window.openEditModal = (id) => {
        const lesson = myLessonsCache.find(l => l.id === id) || allLessonsCache.find(l => l.id === id);
        if(!lesson) return;
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-data').value = lesson.data;
        document.getElementById('edit-obiettivo').value = lesson.obiettivo;
        document.getElementById('edit-attivita').value = lesson.attivita;
        document.getElementById('edit-modal').style.display = 'flex';
    };
    window.closeEditModal = () => document.getElementById('edit-modal').style.display = 'none';
    window.saveEdit = async () => {
        const id = document.getElementById('edit-id').value;
        try {
            await updateDoc(doc(db, "registro_didattico", id), {
                data: document.getElementById('edit-data').value,
                obiettivo: document.getElementById('edit-obiettivo').value,
                attivita: document.getElementById('edit-attivita').value
            });
            closeEditModal();
        } catch(e) { alert(e.message); }
    };
    window.salvaLezione = async () => {
        try {
            await addDoc(collection(db, "registro_didattico"), {
                uid: currentUser.uid,
                email: currentUser.email,
                data: document.getElementById('data').value,
                corso: document.getElementById('corso').value,
                obiettivo: document.getElementById('obiettivo').value,
                attivita: document.getElementById('attivita').value,
                timestamp: new Date()
            });
            alert("Salvato! ✅");
            document.getElementById('attivita').value = "";
            document.getElementById('obiettivo').value = "";
        } catch(e){ alert(e.message); }
    };

    // --- LOGICA ADMIN ---
    function initAdmin() {
        initLevels();
        onSnapshot(query(collection(db, "registro_didattico"), orderBy("data", "desc")), (snap) => {
            allLessonsCache = [];
            snap.forEach(d => allLessonsCache.push({id:d.id, ...d.data()}));
            renderAdminDashboard();
        });
        onSnapshot(collection(db, "corsi_assegnati"), (snap) => {
            allAssignmentsCache = [];
            snap.forEach(d => allAssignmentsCache.push({id:d.id, ...d.data()}));
            renderAdminDashboard();
        });
    }

    // Gestione Livelli
    function initLevels() {
        const levelsDiv = document.getElementById('levels-container');
        const select = document.getElementById('new-level-select');
        onSnapshot(query(collection(db, "elenco_livelli"), orderBy("nome")), (snap) => {
            levelsDiv.innerHTML = "";
            select.innerHTML = '<option value="">Scegli...</option>';
            if(snap.empty) levelsDiv.innerHTML = "<span style='font-size:0.8rem; color:#666'>Nessun livello. Aggiungine uno!</span>";
            snap.forEach(d => {
                const lvl = d.data().nome;
                levelsDiv.innerHTML += `<div class="level-tag">${lvl}<button class="btn-del-level" onclick="deleteLevel('${d.id}')">✕</button></div>`;
                select.innerHTML += `<option value="${lvl}">${lvl}</option>`;
            });
        });
    }
    window.saveNewLevel = async () => {
        const name = document.getElementById('new-level-input').value.trim();
        if(!name) return;
        try { await addDoc(collection(db, "elenco_livelli"), { nome: name }); document.getElementById('new-level-input').value = ""; } catch(e) { alert(e.message); }
    };
    window.deleteLevel = async (id) => { if(confirm("Eliminare questo livello?")) await deleteDoc(doc(db, "elenco_livelli", id)); };
    
    // Gestione Corsi Admin
    window.addCourseStructured = async () => {
        const lvl = document.getElementById('new-level-select').value;
        const day = document.getElementById('new-day').value;
        const time = document.getElementById('new-time').value;
        const email = document.getElementById('new-email').value.trim().toLowerCase();
        if(!lvl || !day || !time || !email) return alert("Compila tutti i campi!");
        const fullName = `${lvl} - ${day} ${time}`;
        try {
            await addDoc(collection(db, "corsi_assegnati"), { 
                nome: fullName, livello: lvl, giorno: day, ora: time, istruttore: email, created: new Date() 
            });
            alert("Corso Creato: " + fullName);
            document.getElementById('new-email').value = "";
        } catch(e){ alert(e.message); }
    };
    
    // Rimuovi Assegnazione
    window.deleteAssignment = async (id) => {
        if(confirm("Vuoi togliere l'assegnazione di questo corso all'istruttore?")) {
            await deleteDoc(doc(db, "corsi_assegnati", id));
        }
    };

    window.renderAdminDashboard = (filterEmail = null) => {
        const instructorsMap = {};
        allAssignmentsCache.forEach(a => {
            const e = a.istruttore;
            if(!instructorsMap[e]) instructorsMap[e] = { count: 0, lastDate: null };
        });
        allLessonsCache.forEach(l => {
            const e = l.email;
            if(!instructorsMap[e]) instructorsMap[e] = { count: 0, lastDate: null };
            instructorsMap[e].count++;
            if(!instructorsMap[e].lastDate || l.data > instructorsMap[e].lastDate) instructorsMap[e].lastDate = l.data;
        });

        const grid = document.getElementById('instructors-grid');
        grid.innerHTML = "";
        const emails = Object.keys(instructorsMap).sort();
        
        if (emails.length === 0) grid.innerHTML = "<p>Nessun istruttore attivo.</p>";
        else {
            emails.forEach(email => {
                const data = instructorsMap[email];
                const name = email.split('@')[0].toUpperCase();
                const activeClass = (email === filterEmail) ? 'active' : '';
                const lastDate = data.lastDate ? new Date(data.lastDate).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}) : '--';
                
                grid.innerHTML += `
                    <div class="user-card ${activeClass}" onclick="renderAdminDashboard('${email}')">
                        <div class="uc-name">${name}</div>
                        <span class="uc-email">${email}</span>
                        <div class="uc-stats">
                            <span class="uc-val">${data.count} <small style="font-size:0.7rem; color:#999; font-weight:400">LEZIONI</small></span>
                            <span class="uc-val" style="color:#10b981">${lastDate}</span>
                        </div>
                    </div>
                `;
            });
        }

        const detailArea = document.getElementById('admin-detail-area');
        const assignedListDiv = document.getElementById('admin-assigned-list');
        const lessonListDiv = document.getElementById('admin-lessons-list');
        
        if(filterEmail) {
            detailArea.classList.remove('hidden');
            document.getElementById('adm-sel-user').innerText = filterEmail;
            
            // Render Corsi Assegnati
            assignedListDiv.innerHTML = "";
            const userAssignments = allAssignmentsCache.filter(a => a.istruttore === filterEmail);
            if(userAssignments.length === 0) assignedListDiv.innerHTML = "<p style='font-size:0.9rem; color:#666'>Nessun corso assegnato.</p>";
            else {
                userAssignments.forEach(c => {
                    assignedListDiv.innerHTML += `
                        <div class="ac-item">
                            <span class="ac-title">${c.nome}</span>
                            <button class="btn-del-assign" onclick="deleteAssignment('${c.id}')">Elimina</button>
                        </div>
                    `;
                });
            }

            // Render Storico Lezioni
            lessonListDiv.innerHTML = "";
            const filtered = allLessonsCache.filter(l => l.email === filterEmail);
            if(filtered.length === 0) lessonListDiv.innerHTML = "<p>Nessuna lezione registrata.</p>";
            filtered.forEach(l => {
                lessonListDiv.innerHTML += `
                    <div class="lezione-card">
                        <div class="card-top">
                            <span class="date-badge">📅 ${new Date(l.data).toLocaleDateString()}</span>
                            <strong>${l.corso}</strong>
                        </div>
                        <div style="font-weight:600; color:#333">🎯 ${l.obiettivo || '-'}</div>
                        <div style="color:#555; font-size:0.9rem">${l.attivita}</div>
                    </div>
                `;
            });
        } else {
            detailArea.classList.add('hidden');
        }
    };

</script>
</body>
</html>
