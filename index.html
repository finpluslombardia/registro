<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Personale Istruttori</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- STILE VISIVO --- */
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        h2 { text-align: center; color: #4f46e5; margin-bottom: 5px; font-weight: 800; }
        .subtitle { text-align: center; color: #6b7280; font-size: 0.9rem; margin-bottom: 30px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; color: #4b5563; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; box-sizing: border-box; background: #fff; }
        input:focus, select:focus { border-color: #4f46e5; outline: 2px solid #e0e7ff; }
        textarea { height: 100px; resize: vertical; }
        
        button { width: 100%; padding: 12px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #4338ca; }
        button.secondary { background-color: #9ca3af; }
        button.danger { background-color: #ef4444; width: auto; padding: 4px 10px; font-size: 0.75rem; margin-left: 10px; }

        /* Card Lezioni */
        .lezione-card { background: #fff; border: 1px solid #e5e7eb; border-left: 5px solid #4f46e5; padding: 16px; margin-top: 15px; border-radius: 8px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .date-badge { background: #f3f4f6; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; color: #6b7280; }
        .course-title { font-weight: 700; color: #111; font-size: 1.1rem; }
        .instr-badge { background: #e0e7ff; color: #4338ca; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; margin-left: 5px; }

        /* Admin List Items */
        .admin-course-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #fff; border-bottom: 1px solid #e5e7eb; }
        .admin-course-item:last-child { border-bottom: none; }
        .ac-details { display: flex; flex-direction: column; }
        .ac-name { font-weight: bold; font-size: 0.95rem; }
        .ac-assignee { font-size: 0.8rem; color: #6b7280; }

        .hidden { display: none !important; }
        .badge-admin { background: #fef3c7; color: #d97706; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; vertical-align: middle; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro Didattico</h2>
    <div class="subtitle" id="user-display"></div>

    <div id="login-section">
        <div style="max-width:350px; margin:40px auto; text-align:center;">
            <p style="margin-bottom:20px; color:#666">Accedi per visualizzare i <strong>tuoi</strong> corsi</p>
            <input type="email" id="email" placeholder="Email" style="margin-bottom:10px">
            <input type="password" id="password" placeholder="Password" style="margin-bottom:20px">
            <button id="btn-login">Accedi</button>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        
        <div id="admin-panel" class="hidden" style="background: #fffbeb; border: 1px solid #fcd34d; padding: 20px; border-radius: 12px; margin-bottom: 30px;">
            <h3 style="margin-top:0; color:#b45309; font-size:1.1rem">🛠 Assegna Corso (Solo Admin)</h3>
            <p style="font-size:0.85rem; color:#b45309; margin-bottom:15px; line-height:1.4">
                Crea un corso e assegnalo all'email specifica dell'istruttore.<br>
                Solo quell'istruttore vedrà questo corso nel suo menu.
            </p>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr auto; gap:10px; align-items:end; margin-bottom:20px;">
                <div>
                    <label style="color:#b45309">Nome Corso</label>
                    <input type="text" id="new-course-name" placeholder="Es. Lunedì 17:00 Liv.1">
                </div>
                <div>
                    <label style="color:#b45309">Assegna a (Email Istruttore)</label>
                    <input type="email" id="new-course-email" placeholder="mario@email.com">
                </div>
                <button onclick="addCourse()" style="width:auto; background:#d97706; margin-bottom:2px">Crea</button>
            </div>
            
            <div style="background: white; border-radius: 8px; border: 1px solid #e5e7eb; max-height: 200px; overflow-y: auto;">
                <div id="admin-courses-list"></div>
            </div>
        </div>

        <div id="instructor-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
                <h3 style="margin:0; border:none; font-size:1.1rem">📝 Compila Registro</h3>
                <button onclick="logout()" class="secondary" style="width:auto; padding:6px 12px; font-size:0.8rem">Esci</button>
            </div>

            <div style="background:#f9fafb; padding:20px; border-radius:12px; border:1px solid #e5e7eb;">
                <div class="form-group">
                    <label>Data Lezione</label>
                    <input type="date" id="data">
                </div>
                
                <div class="form-group">
                    <label>Seleziona il TUO corso</label>
                    <select id="corso">
                        <option value="">-- Caricamento... --</option>
                    </select>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px">
                    <div class="form-group">
                        <label>Livello Oggi</label>
                        <select id="livello">
                            <option>Principiante</option>
                            <option>Intermedio</option>
                            <option>Avanzato</option>
                            <option>Agonismo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Obiettivo</label>
                        <input type="text" id="obiettivo" placeholder="Es. Virata">
                    </div>
                </div>

                <div class="form-group">
                    <label>Attività Svolta</label>
                    <textarea id="attivita" placeholder="Descrivi cosa avete fatto..."></textarea>
                </div>

                <button onclick="salvaLezione()">Salva Scheda</button>
            </div>

            <div style="margin-top:40px; display:flex; gap:10px; align-items:center">
                <h3 style="margin:0">📚 Storico</h3>
                <input type="text" id="search-filter" placeholder="Cerca nel registro..." onkeyup="ascoltaLezioni()" style="width:200px; padding:6px; font-size:0.85rem">
            </div>
            
            <div id="lista-lezioni">Caricamento...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // CONFIGURAZIONE
    const firebaseConfig = {
      apiKey: "AIzaSyAi5AwcIcjgLGyI7E8x4ndcYCI9DUIybeA",
      authDomain: "gestioneore-3bf5f.firebaseapp.com",
      projectId: "gestioneore-3bf5f",
      storageBucket: "gestioneore-3bf5f.firebasestorage.app",
      messagingSenderId: "99818377406",
      appId: "1:99818377406:web:a62ee0e6f323b8b4178eef"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentUser = null;
    const ADMIN_EMAIL = "a.chiodini01@gmail.com"; 

    // --- LOGIN ---
    document.getElementById('btn-login').addEventListener('click', async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
        catch (e) { alert("Errore: " + e.message); }
    });
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-display').innerHTML = `Ciao <strong>${user.email}</strong> ${isAdmin ? '<span class="badge-admin">ADMIN</span>' : ''}`;
            document.getElementById('data').valueAsDate = new Date();

            loadCorsiOptions(isAdmin);
            ascoltaLezioni(isAdmin);

            if(isAdmin) {
                document.getElementById('admin-panel').classList.remove('hidden');
                renderAdminCorsiList();
            } else {
                document.getElementById('admin-panel').classList.add('hidden');
            }
        } else {
            currentUser = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('user-display').innerText = "";
        }
    });

    // --- FUNZIONI ADMIN (CREAZIONE CORSI) ---
    
    window.addCourse = async () => {
        const name = document.getElementById('new-course-name').value.trim();
        const assignee = document.getElementById('new-course-email').value.trim().toLowerCase();
        
        if(!name || !assignee) { alert("Inserisci Nome Corso e Email dell'istruttore."); return; }

        try {
            await addDoc(collection(db, "corsi_assegnati"), { 
                nome: name, 
                istruttore: assignee, 
                created: new Date() 
            });
            document.getElementById('new-course-name').value = "";
            document.getElementById('new-course-email').value = "";
        } catch(e) { alert("Errore: " + e.message); }
    };

    window.deleteCourse = async (id) => {
        if(confirm("Eliminare definitivamente questo corso e l'assegnazione?")) {
            await deleteDoc(doc(db, "corsi_assegnati", id));
        }
    };

    function renderAdminCorsiList() {
        const q = query(collection(db, "corsi_assegnati"), orderBy("created", "desc"));
        onSnapshot(q, (snap) => {
            const list = document.getElementById('admin-courses-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const c = d.data();
                list.innerHTML += `
                    <div class="admin-course-item">
                        <div class="ac-details">
                            <span class="ac-name">${c.nome}</span>
                            <span class="ac-assignee">Assegnato a: ${c.istruttore}</span>
                        </div>
                        <button class="danger" onclick="deleteCourse('${d.id}')">Elimina</button>
                    </div>
                `;
            });
        });
    }

    // --- FUNZIONI UTENTE (MENU E REGISTRO) ---

    // Carica il menu a tendina
    function loadCorsiOptions(isAdmin) {
        let q;
        if(isAdmin) {
            // L'admin nel menu a tendina vede TUTTI i corsi (per testare o inserire note extra)
            q = query(collection(db, "corsi_assegnati"), orderBy("nome", "asc"));
        } else {
            // L'ISTRUTTORE vede SOLO i suoi!
            q = query(collection(db, "corsi_assegnati"), where("istruttore", "==", currentUser.email.toLowerCase()));
        }

        onSnapshot(q, (snap) => {
            const select = document.getElementById('corso');
            select.innerHTML = '<option value="">-- Seleziona Corso --</option>';
            
            if(snap.empty && !isAdmin) {
                select.innerHTML += '<option disabled>Nessun corso assegnato a te.</option>';
            }

            snap.forEach(d => {
                const c = d.data();
                // Se sono admin, mostro anche a chi appartiene per non confondermi
                const label = isAdmin ? `${c.nome} (${c.istruttore})` : c.nome;
                select.innerHTML += `<option value="${c.nome}">${label}</option>`;
            });
        });
    }

    window.salvaLezione = async () => {
        const data = document.getElementById('data').value;
        const corso = document.getElementById('corso').value;
        const livello = document.getElementById('livello').value;
        const obiettivo = document.getElementById('obiettivo').value;
        const attivita = document.getElementById('attivita').value;

        if(!corso || !attivita) { alert("Compila Corso e Attività."); return; }

        try {
            await addDoc(collection(db, "registro_didattico"), {
                uid: currentUser.uid,
                email: currentUser.email,
                data: data,
                corso: corso, 
                livello: livello,
                obiettivo: obiettivo,
                attivita: attivita,
                timestamp: new Date()
            });
            alert("Salvato! ✅");
            document.getElementById('attivita').value = "";
            document.getElementById('obiettivo').value = "";
        } catch (e) { alert(e.message); }
    };

    window.ascoltaLezioni = (isAdmin) => {
        const filterTxt = document.getElementById('search-filter')?.value.toLowerCase() || "";
        // Nota: Per semplicità scarichiamo tutto e filtriamo in locale, ma su grandi dati andrebbe fatto filtro DB
        // Per ora prendiamo tutto il registro
        const q = query(collection(db, "registro_didattico"), orderBy("data", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('lista-lezioni');
            list.innerHTML = "";
            
            let lezioni = [];
            snapshot.forEach(doc => lezioni.push({id:doc.id, ...doc.data()}));

            // Filtro logico
            const filtered = lezioni.filter(l => {
                // Se NON sono admin, vedo solo le mie
                const isMine = (l.email === currentUser.email);
                // Se SONO admin, vedo tutto
                const allowed = isAdmin ? true : isMine;
                
                // Filtro di ricerca testuale
                const matchesText = (
                    l.corso.toLowerCase().includes(filterTxt) || 
                    l.attivita.toLowerCase().includes(filterTxt) ||
                    l.email.toLowerCase().includes(filterTxt)
                );

                return allowed && matchesText;
            });

            if(filtered.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#999'>Nessuna scheda trovata.</p>";
                return;
            }

            filtered.forEach(l => {
                const dataNice = new Date(l.data).toLocaleDateString('it-IT');
                // Se admin, mostro chi l'ha scritta
                const writerBadge = isAdmin ? `<span class="instr-badge">${l.email.split('@')[0]}</span>` : '';

                list.innerHTML += `
                    <div class="lezione-card">
                        <div class="card-header">
                            <div>
                                <span class="date-badge">📅 ${dataNice}</span>
                                ${writerBadge}
                                <div style="margin-top:4px" class="course-title">${l.corso}</div>
                            </div>
                            <span style="font-size:0.8rem; font-weight:bold; color:#4f46e5">${l.livello}</span>
                        </div>
                        <div style="font-size:0.9rem; margin-bottom:10px; color:#555">
                            <strong>🎯 Obiettivo:</strong> ${l.obiettivo || '-'}
                        </div>
                        <div style="background:#f9fafb; padding:10px; border-radius:6px; font-size:0.95rem; color:#333">
                            ${l.attivita}
                        </div>
                    </div>
                `;
            });
        });
    };
</script>

</body>
</html>
